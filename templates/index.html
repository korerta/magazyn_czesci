<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Strona główna</title>
</head>
<body>
    <a href="#">Dodaj element do magazynu</a><br>
    <a href="#">Kosz</a><br>
    <form method="post">
        <h2>Wyszukaj element według ID</h2>
        <input type="text" name="id_search" placeholder="ID elementu"/>
        <button type="submit">Wyszukaj element</button>
    </form><br>
    <form method="post">
        <h2>Usuń element z magazynu według ID</h2>
        <input type="text" name="id_del" placeholder="ID elementu"/>
        <button type="submit">Usuń element</button>
    </form><br>
    <form method="post">
        <h2>Wyszukaj element według tagu</h2>
        <input type="text" name="tag_element" placeholder="tag"/>
        <button type="submit">Wyszukaj element</button>
    </form>
</body>
</html>
