<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dodaj część do magazynu</title>
</head>
<body>
    <style>
        .text{
        width: 100%;
        }
    </style>

    <a href="{{ url_for('home') }}">Strona główna</a><br>

    <h1>Dodaj część do magazynu</h1><br>
    <form method="post" enctype="multipart/form-data">
        {{ data['message'] }} {{ data['error'] }}
        <input type="text" class="text" name="name_part" placeholder="Nazwa części"/>
        <input type="text" class="text" name="desc_part" placeholder="Opis części"/>
        <input type="text" class="text" name="condition_part" placeholder="Stan części (uszkodzony, nowy itp)"/>
        <input type="text" class="text" name="oem_part" placeholder="Numer OEM części"/>
        <input type="text" class="text" name="vehicle" placeholder="Z jakiego pojazdu część pochodzi"/>
        <input type="text" class="text" name="location" placeholder="Lokalizacja w magazynie"/>
        <label for="is_wrapped">Czy zapakowana część</label>
        <input type="checkbox" id="is_wrapped" name="is_wrapped"/><br>
        <input type="file" name="photos" accept="image/*" multiple><br>
        <button type="submit">Dodaj część</button>
    </form>
</body>
</html>
